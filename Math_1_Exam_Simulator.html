<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math 1 - Final Exam Simulator</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;700;900&family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
    
    <script>
        window.MathJax = {
            loader: {load: ['[tex]/color']},
            tex: { 
                inlineMath: [['$', '$'], ['\\(', '\\)']], 
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                packages: {'[+]': ['color']}
            }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

    <style>
        :root {
            --bg-dark: #070714;
            --neon-cyan: #00f3ff;
            --neon-magenta: #ff00ea;
            --neon-lime: #39ff14;
            --neon-red: #ff2a2a;
            --glass-bg: rgba(20, 20, 35, 0.4);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-main: #e0e0ff;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 50% 50%, rgba(57, 255, 20, 0.05) 0%, transparent 60%);
            background-attachment: fixed;
            color: var(--text-main);
            font-family: 'Cairo', 'Poppins', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
        }

        .container {
            width: 100%;
            max-width: 800px;
        }

        /* Top Bar */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            padding: 15px 30px;
            border-radius: 15px;
            margin-bottom: 30px;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }

        .counter {
            font-family: 'Poppins', sans-serif;
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--neon-cyan);
            text-shadow: 0 0 10px rgba(0, 243, 255, 0.4);
        }

        .score-display {
            font-family: 'Poppins', sans-serif;
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--neon-lime);
        }

        /* Question Box */
        .question-card {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--neon-magenta);
            box-shadow: 0 0 30px rgba(255, 0, 234, 0.1);
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            display: none; /* hidden until JS loads it */
            animation: fadeIn 0.4s ease;
        }

        .question-card.active {
            display: block;
        }

        .question-text {
            font-family: 'Poppins', sans-serif;
            font-size: 1.5rem;
            margin-bottom: 30px;
            direction: ltr;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
        }

        .option-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-main);
            padding: 20px;
            border-radius: 12px;
            cursor: pointer;
            font-family: 'Poppins', sans-serif;
            font-size: 1.2rem;
            text-align: left;
            direction: ltr;
            transition: all 0.3s;
        }

        .option-btn:hover:not(:disabled) {
            background: rgba(0, 243, 255, 0.1);
            border-color: var(--neon-cyan);
            transform: translateX(-5px);
        }

        .option-btn.correct { background: rgba(57, 255, 20, 0.15); border-color: var(--neon-lime); color: var(--neon-lime); }
        .option-btn.wrong { background: rgba(255, 42, 42, 0.15); border-color: var(--neon-red); color: var(--neon-red); }
        .option-btn:disabled { cursor: not-allowed; }

        .feedback-box {
            margin-top: 25px;
            padding: 20px;
            border-radius: 12px;
            display: none;
            text-align: right;
            animation: fadeIn 0.4s ease;
        }

        .next-btn {
            background: var(--neon-cyan);
            color: #000;
            border: none;
            padding: 15px 40px;
            font-family: 'Cairo', sans-serif;
            font-size: 1.3rem;
            font-weight: bold;
            border-radius: 30px;
            margin-top: 25px;
            cursor: pointer;
            display: none;
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.5);
            transition: 0.3s;
        }

        .next-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 25px rgba(0, 243, 255, 0.8);
        }

        /* Results Screen */
        .results-card {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--neon-lime);
            box-shadow: 0 0 40px rgba(57, 255, 20, 0.2);
            border-radius: 20px;
            padding: 50px;
            text-align: center;
            display: none;
        }

        .results-card h1 {
            font-size: 3rem;
            color: var(--neon-lime);
            margin-bottom: 20px;
        }

        .action-btn {
            background: transparent;
            color: var(--neon-cyan);
            border: 2px solid var(--neon-cyan);
            padding: 10px 30px;
            border-radius: 20px;
            text-decoration: none;
            font-family: 'Cairo', sans-serif;
            font-weight: bold;
            font-size: 1.2rem;
            transition: 0.3s;
            display: inline-block;
            margin-top: 20px;
        }

        .action-btn:hover { background: var(--neon-cyan); color: #000; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<div class="container">
    
    <div style="text-align: right; margin-bottom: 10px;">
        <a href="index.html" class="action-btn" style="font-size: 1rem; padding: 5px 15px; margin-top:0;">الرجوع للرئيسية</a>
    </div>

    <!-- Top Status Bar -->
    <div class="top-bar" id="topBar">
        <div class="score-display">Score: <span id="scoreVal">0</span></div>
        <div class="counter">Q: <span id="qCount">1</span> / 100</div>
    </div>

    <!-- Question Container -->
    <div id="quiz-container">
        <!-- JS will inject questions here -->
    </div>

    <!-- Results Container -->
    <div class="results-card" id="results-container">
        <h1>الامتحان خلص! 🎉</h1>
        <p style="font-size: 1.5rem; margin-bottom: 30px;">نتيجتك: <span id="finalScore" style="color: var(--neon-cyan); font-weight: bold; font-size: 2rem;"></span> / 100</p>
        <button class="action-btn" onclick="location.reload()">إعادة الامتحان</button>
    </div>

</div>

<script>
    // Placeholder array. The user will provide 100 questions later. 
    // This framework supports an infinite number of questions and automatically adjusts.
    const questions = [
        {
            text: "What is the domain of \\( f(x) = \\frac{1}{x-2} \\)?",
            options: [
                "\\( \\mathbb{R} \\)",
                "\\( \\mathbb{R} - \\{-2\\} \\)",
                "\\( \\mathbb{R} - \\{2\\} \\)",
                "\\( [2, \\infty) \\)"
            ],
            correct: 2, // index of correct option
            explanation: "لأن المقام مينفعش يساوي صفر، يعني \\( x - 2 \\neq 0 \\) وبالتالي \\( x \\neq 2 \\). المسموح بيه هو كل الأرقام ما عدا 2."
        },
        {
            text: "Determine if \\( f(x) = x^2 \\) is Even or Odd.",
            options: [
                "Even",
                "Odd",
                "Neither"
            ],
            correct: 0,
            explanation: "لو عوضنا بـ \\(-x\\) مكان \\(x\\)، الباور الزوجي هيطير السالب \\( f(-x) = (-x)^2 = x^2 = f(x) \\)."
        },
        {
            text: "If \\( f(x) = 2x + 3 \\) and \\( g(x) = x - 1 \\), what is \\( (f \\circ g)(x) \\)?",
            options: [
                "\\( 2x + 2 \\)",
                "\\( 2x + 1 \\)",
                "\\( 2x - 1 \\)",
                "\\( 3x + 2 \\)"
            ],
            correct: 1,
            explanation: "هنشيل كل x في f ونحط مكانها الدالة g كلها: \\( 2(x - 1) + 3 = 2x - 2 + 3 = 2x + 1 \\)."
        },
        {
            text: "What is \\( \\lim_{x \\to 1} \\frac{x^2 - 1}{x - 1} \\)?",
            options: [
                "0",
                "1",
                "2",
                "Does Not Exist"
            ],
            correct: 2,
            explanation: "بالتعويض المباشر هتطلع \\( 0/0 \\). هنحلل البسط \\( (x-1)(x+1) \\) ونطير \\( (x-1) \\). هيتبقى \\( x+1 \\)، نعوض تطلع 2."
        },
        {
            text: "If \\( \\lim_{x \\to a^-} f(x) = 3 \\) and \\( \\lim_{x \\to a^+} f(x) = 1 \\), then \\( \\lim_{x \\to a} f(x) \\) is:",
            options: [
                "3",
                "1",
                "4",
                "Does Not Exist"
            ],
            correct: 3,
            explanation: "عشان النهاية تبقى موجودة لازم اليمين يساوي الشمال، وهنا هما مختلفين."
        },
        {
            text: "Evaluate \\( \\lim_{x \\to \\infty} \\frac{3x^2 - x}{5x^2 + 1} \\).",
            options: [
                "0",
                "\\( \\frac{3}{5} \\)",
                "\\( \\infty \\)",
                "Does Not Exist"
            ],
            correct: 1,
            explanation: "أكبر باور فوق هو تربيع وأكبر باور تحت هو تربيع، يبقى ناخد معامل اللي فوق على معامل اللي تحت \\( 3/5 \\)."
        },
        // We can add the rest of the 100 questions here later!
    ];

    let currentQ = 0;
    let score = 0;
    const totalQ = 100; // Hardcoded to 100 as requested, even if array is smaller currently

    const container = document.getElementById('quiz-container');
    const scoreSpan = document.getElementById('scoreVal');
    const countSpan = document.getElementById('qCount');

    function loadQuestion() {
        if(currentQ >= questions.length || currentQ >= totalQ) {
            showResults();
            return;
        }

        countSpan.innerText = currentQ + 1;

        const q = questions[currentQ];
        
        let optionsHTML = '';
        q.options.forEach((opt, index) => {
            optionsHTML += `<button class="option-btn" onclick="checkAnswer(${index}, ${q.correct})">${opt}</button>`;
        });

        container.innerHTML = `
            <div class="question-card active">
                <div class="question-text">${currentQ + 1}. ${q.text}</div>
                <div class="options-grid">
                    ${optionsHTML}
                </div>
                <div class="feedback-box" id="feedback"></div>
                <button class="next-btn" id="nextBtn" onclick="nextQuestion()">Next Question ➡️</button>
            </div>
        `;
        
        MathJax.typesetPromise();
    }

    function checkAnswer(selectedIndex, correctIndex) {
        const btns = document.querySelectorAll('.option-btn');
        const feedback = document.getElementById('feedback');
        const nextBtn = document.getElementById('nextBtn');

        // Disable all buttons
        btns.forEach(b => b.disabled = true);

        // Check if correct
        if(selectedIndex === correctIndex) {
            btns[selectedIndex].classList.add('correct');
            score++;
            scoreSpan.innerText = score;
            feedback.innerHTML = `<span style="color: var(--neon-lime); font-weight: bold;">✅ صح!</span><br><br>${questions[currentQ].explanation}`;
            feedback.style.background = 'rgba(57, 255, 20, 0.1)';
            feedback.style.border = '1px solid var(--neon-lime)';
        } else {
            btns[selectedIndex].classList.add('wrong');
            btns[correctIndex].classList.add('correct'); // Highlight the correct one
            feedback.innerHTML = `<span style="color: var(--neon-red); font-weight: bold;">❌ غلط! ركز:</span><br><br>${questions[currentQ].explanation}`;
            feedback.style.background = 'rgba(255, 42, 42, 0.1)';
            feedback.style.border = '1px solid var(--neon-red)';
        }

        feedback.style.display = 'block';
        nextBtn.style.display = 'inline-block';
        
        MathJax.typesetPromise();
    }

    function nextQuestion() {
        currentQ++;
        loadQuestion();
    }

    function showResults() {
        document.getElementById('topBar').style.display = 'none';
        document.getElementById('quiz-container').style.display = 'none';
        
        const results = document.getElementById('results-container');
        results.style.display = 'block';
        
        document.getElementById('finalScore').innerText = score;
    }

    // Start the exam
    window.onload = loadQuestion;

</script>

</body>
</html>
