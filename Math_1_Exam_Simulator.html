<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math 1 - Final Exam Simulator (100 Questions)</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;700;900&family=Fira+Code:wght@400;700&family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
    
    <script>
        window.MathJax = {
            loader: {load: ['[tex]/color']},
            tex: { 
                inlineMath: [['$', '$'], ['\\(', '\\)']], 
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                packages: {'[+]': ['color']}
            }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

    <style>
        :root {
            --bg-dark: #070714;
            --neon-cyan: #00f3ff;
            --neon-magenta: #ff00ea;
            --neon-lime: #39ff14;
            --neon-purple: #b026ff;
            --neon-red: #ff2a2a;
            --neon-orange: #ff9d00;
            --glass-bg: rgba(20, 20, 35, 0.4);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-main: #e0e0ff;
            --text-muted: #a0a0c0;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(0, 243, 255, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(255, 0, 234, 0.05) 0%, transparent 50%);
            background-attachment: fixed;
            color: var(--text-main);
            font-family: 'Cairo', 'Poppins', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
        }

        .container {
            width: 100%;
            max-width: 850px;
        }

        h1 {
            text-align: center;
            font-size: 2.5rem;
            background: linear-gradient(90deg, var(--neon-cyan), var(--neon-magenta));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(0, 243, 255, 0.3);
            margin-bottom: 30px;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            padding: 15px 30px;
            border-radius: 15px;
            margin-bottom: 25px;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }

        .counter {
            font-family: 'Poppins', sans-serif;
            font-size: 1.3rem;
            font-weight: bold;
            color: var(--neon-cyan);
            text-shadow: 0 0 10px rgba(0, 243, 255, 0.4);
        }

        .score-display {
            font-family: 'Poppins', sans-serif;
            font-size: 1.3rem;
            font-weight: bold;
            color: var(--neon-lime);
            text-shadow: 0 0 10px rgba(57, 255, 20, 0.4);
        }

        .progress-container {
            width: 100%;
            background: rgba(255,255,255,0.05);
            height: 8px;
            border-radius: 4px;
            margin-bottom: 25px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--neon-cyan), var(--neon-magenta));
            box-shadow: 0 0 10px var(--neon-cyan);
            transition: width 0.3s ease;
        }

        .question-card {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--neon-magenta);
            box-shadow: 0 0 30px rgba(255, 0, 234, 0.1);
            border-radius: 20px;
            padding: 35px;
            animation: fadeIn 0.4s ease;
        }

        .category-badge {
            background: rgba(0, 243, 255, 0.1);
            border: 1px solid var(--neon-cyan);
            color: var(--neon-cyan);
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: bold;
            display: inline-block;
            margin-bottom: 20px;
        }

        .question-text {
            font-family: 'Poppins', sans-serif;
            font-size: 1.4rem;
            margin-bottom: 25px;
            direction: ltr;
            text-align: left;
            line-height: 1.6;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
        }

        .option-btn {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-main);
            padding: 18px;
            border-radius: 12px;
            cursor: pointer;
            font-family: 'Poppins', sans-serif;
            font-size: 1.15rem;
            text-align: left;
            direction: ltr;
            transition: all 0.25s;
        }

        .option-btn:hover:not(:disabled) {
            background: rgba(0, 243, 255, 0.08);
            border-color: var(--neon-cyan);
            transform: translateX(-5px);
        }

        .option-btn.correct { background: rgba(57, 255, 20, 0.15); border-color: var(--neon-lime); color: var(--neon-lime); text-shadow: 0 0 5px var(--neon-lime); }
        .option-btn.wrong { background: rgba(255, 42, 42, 0.15); border-color: var(--neon-red); color: var(--neon-red); }
        .option-btn:disabled { cursor: not-allowed; }

        .feedback-box {
            margin-top: 25px;
            padding: 20px;
            border-radius: 12px;
            display: none;
            text-align: right;
            animation: fadeIn 0.4s ease;
            line-height: 1.8;
        }

        .next-btn {
            background: linear-gradient(45deg, var(--neon-cyan), var(--neon-purple));
            color: #fff;
            border: none;
            padding: 15px 40px;
            font-family: 'Cairo', sans-serif;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 30px;
            margin-top: 25px;
            cursor: pointer;
            display: none;
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.4);
            transition: 0.3s;
        }

        .next-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 25px rgba(0, 243, 255, 0.7);
        }

        .results-card {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--neon-lime);
            box-shadow: 0 0 40px rgba(57, 255, 20, 0.2);
            border-radius: 20px;
            padding: 50px;
            text-align: center;
            display: none;
            animation: fadeIn 0.5s ease;
        }

        .results-card h1 {
            font-size: 3rem;
            color: var(--neon-lime);
            margin-bottom: 20px;
            text-shadow: 0 0 15px var(--neon-lime);
        }

        .action-btn {
            background: transparent;
            color: var(--neon-cyan);
            border: 2px solid var(--neon-cyan);
            padding: 12px 35px;
            border-radius: 25px;
            text-decoration: none;
            font-family: 'Cairo', sans-serif;
            font-weight: bold;
            font-size: 1.1rem;
            transition: 0.3s;
            display: inline-block;
            margin-top: 20px;
            cursor: pointer;
        }

        .action-btn:hover { background: var(--neon-cyan); color: #000; box-shadow: 0 0 15px var(--neon-cyan); }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<div class="container">
    
    <div style="text-align: right; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; width: 100%;">
        <a href="index.html" class="action-btn" style="font-size: 0.95rem; padding: 6px 18px; margin-top:0;">🏠 القائمة الرئيسية</a>
        <h2 style="font-size: 1.2rem; color: var(--text-muted);">Math 1 Final Exam</h2>
    </div>

    <h1>🚀 Final Exam Simulator</h1>
    <p style="text-align: center; color: var(--text-muted); margin-bottom: 35px;">اختبار شامل وعميق مكون من 100 سؤال (10 أسئلة لكل محاضرة) مع شرح تفصيلي بالعامية المصرية لكل سؤال.</p>

    <!-- Top Status Bar -->
    <div class="top-bar" id="topBar">
        <div class="score-display">الدرجة: <span id="scoreVal">0</span> / 100</div>
        <div class="counter">سؤال: <span id="qCount">1</span> / 100</div>
    </div>

    <!-- Progress Bar -->
    <div class="progress-container" id="progContainer">
        <div class="progress-bar" id="pBar"></div>
    </div>

    <!-- Question Container -->
    <div id="quiz-container">
        <!-- Questions injected here dynamically -->
    </div>

    <!-- Results Container -->
    <div class="results-card" id="results-container">
        <h1>الامتحان انتهى بنجاح! 🎉</h1>
        <p style="font-size: 1.6rem; margin-bottom: 15px;">درجتك النهائية هي:</p>
        <div style="font-size: 4rem; font-weight: 900; color: var(--neon-cyan); text-shadow: 0 0 20px rgba(0,243,255,0.5); margin-bottom: 25px;">
            <span id="finalScore"></span> / 100
        </div>
        <p id="performance-comment" style="font-size: 1.25rem; color: var(--text-muted); margin-bottom: 30px; line-height: 1.8; padding: 0 20px;"></p>
        <button class="action-btn" onclick="location.reload()" style="font-size: 1.2rem; padding: 12px 40px;">🔄 أعد الاختبار من جديد</button>
    </div>

</div>

<script>
    const questions = [
        // ==================== LECTURE 1: Functions, Domain & Range (Q1 - Q10) ====================
        {
            category: "Lecture 1: Functions, Domain & Range",
            text: "Find the domain of \\( f(x) = \\frac{1}{x-3} \\).",
            options: [
                "\\( \\mathbb{R} \\)",
                "\\( \\mathbb{R} - \\{-3\\} \\)",
                "\\( \\mathbb{R} - \\{3\\} \\)",
                "\\( (3, \\infty) \\)"
            ],
            correct: 2,
            explanation: "بما إن الدالة كسرية، المقام مينفعش يساوي صفر أبداً عشان القسمة على صفر غير معرفة! يعني: \\( x - 3 \\neq 0 \\implies x \\neq 3 \\). يبقى المجال هو كل الأعداد الحقيقية ما عدا الـ 3."
        },
        {
            category: "Lecture 1: Functions, Domain & Range",
            text: "Find the domain of \\( g(x) = \\sqrt{x - 5} \\).",
            options: [
                "\\( \\mathbb{R} \\)",
                "\\( [5, \\infty) \\)",
                "\\( (5, \\infty) \\)",
                "\\( (-\\infty, 5] \\)"
            ],
            correct: 1,
            explanation: "بما إن عندنا جذر زوجي (تربيعي)، يبقى لازم اللي تحت الجذر يكون أكبر من أو يساوي الصفر عشان ميكونش فيه أعداد تخيلية: \\( x - 5 \\ge 0 \\implies x \\ge 5 \\). يعني الفترة المغلقة من 5 لما لا نهاية."
        },
        {
            category: "Lecture 1: Functions, Domain & Range",
            text: "Determine the symmetry of \\( f(x) = x^3 + x \\).",
            options: [
                "Even (زوجية)",
                "Odd (فردية)",
                "Neither (ليست زوجية وليست فردية)",
                "Symmetric about the x-axis"
            ],
            correct: 1,
            explanation: "لو عوضنا بـ \\(-x\\) مكان كل \\(x\\): \\( f(-x) = (-x)^3 + (-x) = -x^3 - x = -(x^3 + x) = -f(x) \\). طالما الإشارة السالبة طلعت برة الدالة كلها، يبقى الدالة فردية (Odd) ومتماثلة حول نقطة الأصل."
        },
        {
            category: "Lecture 1: Functions, Domain & Range",
            text: "Find the range of \\( f(x) = x^2 + 4 \\).",
            options: [
                "\\( \\mathbb{R} \\)",
                "\\( [0, \\infty) \\)",
                "\\( [4, \\infty) \\)",
                "\\( (4, \\infty) \\)"
            ],
            correct: 2,
            explanation: "الـ \\( x^2 \\) دايماً قيمتها أكبر من أو تساوي الصفر لأي عدد حقيقي. فلما نجمع عليها 4، أقل قيمة ممكنة هتكون \\( 0 + 4 = 4 \\)، وبالتالي المدى (Range) هيكون من 4 مغلق إلى ما لا نهاية."
        },
        {
            category: "Lecture 1: Functions, Domain & Range",
            text: "If \\( f(x) = 3x - 2 \\), find its inverse function \\( f^{-1}(x) \\).",
            options: [
                "\\( f^{-1}(x) = \\frac{x-2}{3} \\)",
                "\\( f^{-1}(x) = \\frac{x+2}{3} \\)",
                "\\( f^{-1}(x) = 2x - 3 \\)",
                "\\( f^{-1}(x) = 3x + 2 \\)"
            ],
            correct: 1,
            explanation: "عشان نجيب المعكوس: هنخلي الدالة \\( y = 3x - 2 \\)، بعدين نبدل الرموز فتبقى \\( x = 3y - 2 \\). ونحل المعادلة عشان نجيب \\(y\\) لوحدها: \\( x + 2 = 3y \\implies y = \\frac{x+2}{3} \\). ده هو المعكوس!"
        },
        {
            category: "Lecture 1: Functions, Domain & Range",
            text: "If \\( f(x) = x^2 \\) and \\( g(x) = 2x + 1 \\), find \\( (f \\circ g)(x) \\).",
            options: [
                "\\( 2x^2 + 1 \\)",
                "\\( 4x^2 + 1 \\)",
                "\\( 4x^2 + 4x + 1 \\)",
                "\\( 2x^2 + 2x + 1 \\)"
            ],
            correct: 2,
            explanation: "تركيب الدوال يعني هنشيل كل \\(x\\) في الدالة الخارجية \\(f\\) ونحط مكانها الدالة الداخلية \\(g(x)\\) كاملة: \\( (f \\circ g)(x) = f(g(x)) = (2x + 1)^2 = 4x^2 + 4x + 1 \\)."
        },
        {
            category: "Lecture 1: Functions, Domain & Range",
            text: "Find the domain of \\( f(x) = \\frac{1}{\\sqrt{x-2}} \\).",
            options: [
                "\\( [2, \\infty) \\)",
                "\\( (2, \\infty) \\)",
                "\\( \\mathbb{R} - \\{2\\} \\)",
                "\\( (-\\infty, 2) \\)"
            ],
            correct: 1,
            explanation: "هنا عندنا جذر في المقام، يعني لازم نجمع بين شرطين: المقام ميبقاش صفر، واللي تحت الجذر ميبقاش سالب. يعني لازم \\( x-2 > 0 \\implies x > 2 \\)، عشان كده الفترة مفتوحة عند الـ 2."
        },
        {
            category: "Lecture 1: Functions, Domain & Range",
            text: "Find the domain of the logarithmic function \\( f(x) = \\ln(x-1) \\).",
            options: [
                "\\( \\mathbb{R} \\)",
                "\\( [1, \\infty) \\)",
                "\\( (1, \\infty) \\)",
                "\\( \\mathbb{R} - \\{1\\} \\)"
            ],
            correct: 2,
            explanation: "الدالة اللوغاريتمية الطبيعية \\( \\ln(u) \\) معرفة فقط للأعداد الموجبة تماماً (أكبر من الصفر). يعني لازم \\( x - 1 > 0 \\implies x > 1 \\). المجال هو الفترة المفتوحة \\( (1, \\infty) \\)."
        },
        {
            category: "Lecture 1: Functions, Domain & Range",
            text: "Determine the symmetry of \\( f(x) = \\cos(x) \\).",
            options: [
                "Even (متماثلة حول محور الصادات)",
                "Odd (متماثلة حول نقطة الأصل)",
                "Neither (غير متماثلة)",
                "Symmetric about the x-axis"
            ],
            correct: 0,
            explanation: "دالة الكوزين مشهورة بإنها بـ 'تأكل' السالب: \\( \\cos(-x) = \\cos(x) \\). ده معناه إن \\( f(-x) = f(x) \\)، وبالتالي الدالة زوجية (Even) ومتماثلة تماماً حول محور الصادات (y-axis)."
        },
        {
            category: "Lecture 1: Functions, Domain & Range",
            text: "Which of the following functions is one-to-one (injective) on its entire domain?",
            options: [
                "\\( f(x) = x^2 \\)",
                "\\( f(x) = |x| \\)",
                "\\( f(x) = x^3 \\)",
                "\\( f(x) = \\cos(x) \\)"
            ],
            correct: 2,
            explanation: "الدالة أحادية (One-to-One) هي الدالة اللي لو رسمت خط أفقي يقطعها في نقطة واحدة بس. الـ \\( x^3 \\) دايماً بتزيد ومفيش قيمتين لـ x بيدوا نفس الـ y، عكس التربيع والقيمة المطلقة والكوزين."
        },

        // ==================== LECTURE 2: Limits & Continuity (Q11 - Q20) ====================
        {
            category: "Lecture 2: Limits & Continuity",
            text: "Evaluate \\( \\lim_{x \\to 2} \\frac{x^2 - 4}{x - 2} \\).",
            options: [
                "0",
                "2",
                "4",
                "Does Not Exist"
            ],
            correct: 2,
            explanation: "بالتعويض المباشر بتطلع \\( 0/0 \\) (كمية غير معينة). نحلل البسط كفرق بين مربعين: \\( \\frac{(x-2)(x+2)}{x-2} \\). نطير العامل الصفرى \\( (x-2) \\)، يتبقى \\( x + 2 \\). بالتعويض عن x بـ 2 تطلع النتيجة 4."
        },
        {
            category: "Lecture 2: Limits & Continuity",
            text: "Evaluate \\( \\lim_{x \\to 0} \\frac{\\sin(3x)}{2x} \\).",
            options: [
                "0",
                "\\( \\frac{3}{2} \\)",
                "\\( \\frac{2}{3} \\)",
                "1"
            ],
            correct: 1,
            explanation: "دي متطابقة ونظرية شهيرة جداً في نهايات الدوال المثلثية: \\( \\lim_{x \\to 0} \\frac{\\sin(ax)}{bx} = \\frac{a}{b} \\). مباشرة وبدون لف ودوران تطلع النتيجة \\( 3/2 \\)."
        },
        {
            category: "Lecture 2: Limits & Continuity",
            text: "Evaluate \\( \\lim_{x \\to \\infty} \\frac{2x^3 - 5}{3x^3 + x^2} \\).",
            options: [
                "0",
                "\\( \\frac{2}{3} \\)",
                "\\( \\infty \\)",
                "Does Not Exist"
            ],
            correct: 1,
            explanation: "عندما تؤول x إلى ما لا نهاية ودالة كسرية، بنبص على أكبر أس في البسط والمقام. بما إن الأسس متساوية (تربيعي/تكعيبي)، بناخد معامل أكبر أس في البسط على معامل أكبر أس في المقام، فتطلع النتيجة \\( 2/3 \\)."
        },
        {
            category: "Lecture 2: Limits & Continuity",
            text: "For \\( f(x) = \\begin{cases} x^2 & x < 2 \\\\ 2x & x \\ge 2 \\end{cases} \\), find \\( \\lim_{x \\to 2} f(x) \\).",
            options: [
                "4",
                "2",
                "0",
                "Does Not Exist"
            ],
            correct: 0,
            explanation: "بما إنها دالة معرفة بأكثر من قاعدة عند الـ 2، لازم نجيب النهاية اليمنى واليسرى. النهاية اليسرى (من الشمال): \\( \\lim_{x \\to 2^-} x^2 = 4 \\). النهاية اليمنى (من اليمين): \\( \\lim_{x \\to 2^+} 2x = 4 \\). بما إن النهايتين متساويتين وتساوي 4، إذن النهاية موجودة وتساوي 4."
        },
        {
            category: "Lecture 2: Limits & Continuity",
            text: "Evaluate \\( \\lim_{x \\to \\infty} \\frac{5x + 2}{x^2 + 1} \\).",
            options: [
                "5",
                "0",
                "\\( \\infty \\)",
                "Does Not Exist"
            ],
            correct: 1,
            explanation: "هنا درجة المقام (تربيعي) أكبر من درجة البسط (خطي) عند المالا نهاية، وده معناه إن المقام بيكبر بسرعة رهيبة جداً مقارنة بالبسط، فتؤول قيمة الكسر بالكامل إلى الصفر."
        },
        {
            category: "Lecture 2: Limits & Continuity",
            text: "Find the value of \\( k \\) that makes \\( f(x) = \\begin{cases} kx + 1 & x \\le 3 \\\\ x^2 - 2 & x > 3 \\end{cases} \\) continuous everywhere.",
            options: [
                "k = 1",
                "k = 2",
                "k = 3",
                "k = 4"
            ],
            correct: 1,
            explanation: "عشان تكون متصلة عند نقطة التحول \\( x = 3 \\)، لازم النهاية اليمنى تساوي اليسرى وتساوي قيمة الدالة: \\( f(3) = 3k + 1 \\). واليمين: \\( 3^2 - 2 = 7 \\). نساوي الطرفين: \\( 3k + 1 = 7 \\implies 3k = 6 \\implies k = 2 \\)."
        },
        {
            category: "Lecture 2: Limits & Continuity",
            text: "Evaluate \\( \\lim_{x \\to 0} \\frac{1 - \cos(x)}{x} \\).",
            options: [
                "1",
                "0",
                "\\( \\infty \\)",
                "Does Not Exist"
            ],
            correct: 1,
            explanation: "دي نهاية قياسية مشهورة جداً في التفاضل والتكامل وقيمتها دايماً تساوي صفر. ويمكن إثباتها برضه بضرب البسط والمقام في المرافق الميكانيكي للمقدار."
        },
        {
            category: "Lecture 2: Limits & Continuity",
            text: "Evaluate \\( \\lim_{x \\to 1} \\frac{\\sqrt{x} - 1}{x - 1} \\).",
            options: [
                "0",
                "1",
                "\\( \\frac{1}{2} \\)",
                "2"

    let currentQ = 0;
    let score = 0;
    const totalQ = questions.length; // Dynamic base on array length which is exactly 100!

    const container = document.getElementById('quiz-container');
    const scoreSpan = document.getElementById('scoreVal');
    const countSpan = document.getElementById('qCount');
    const pBar = document.getElementById('pBar');

    function loadQuestion() {
        if(currentQ >= totalQ) {
            showResults();
            return;
        }

        // Update progress bar
        const progressPercentage = (currentQ / totalQ) * 100;
        pBar.style.width = `${progressPercentage}%`;

        countSpan.innerText = currentQ + 1;

        const q = questions[currentQ];
        
        let optionsHTML = '';
        q.options.forEach((opt, index) => {
            optionsHTML += `<button class="option-btn" onclick="checkAnswer(${index}, ${q.correct})">${opt}</button>`;
        });

        container.innerHTML = `
            <div class="question-card">
                <div class="category-badge">${q.category}</div>
                <div class="question-text">${currentQ + 1}. ${q.text}</div>
                <div class="options-grid">
                    ${optionsHTML}
                </div>
                <div class="feedback-box" id="feedback"></div>
                <div style="text-align: left;">
                    <button class="next-btn" id="nextBtn" onclick="nextQuestion()">السؤال التالي ➡️</button>
                </div>
            </div>
        `;
        
        MathJax.typesetPromise();
    }

    function checkAnswer(selectedIndex, correctIndex) {
        const btns = document.querySelectorAll('.option-btn');
        const feedback = document.getElementById('feedback');
        const nextBtn = document.getElementById('nextBtn');

        // Disable all buttons to freeze the answer
        btns.forEach(b => b.disabled = true);

        // Check if correct
        if(selectedIndex === correctIndex) {
            btns[selectedIndex].classList.add('correct');
            score++;
            scoreSpan.innerText = score;
            feedback.innerHTML = `<span style="color: var(--neon-lime); font-weight: bold; font-size: 1.25rem;">✅ الله عليك يا هندسة! إجابة صحيحة.</span><br><br>${questions[currentQ].explanation}`;
            feedback.style.background = 'rgba(57, 255, 20, 0.08)';
            feedback.style.border = '1px solid var(--neon-lime)';
        } else {
            btns[selectedIndex].classList.add('wrong');
            btns[correctIndex].classList.add('correct'); // Highlight the correct one
            feedback.innerHTML = `<span style="color: var(--neon-red); font-weight: bold; font-size: 1.25rem;">❌ ركز يا هندسة، الإجابة غير صحيحة.</span><br><br>${questions[currentQ].explanation}`;
            feedback.style.background = 'rgba(255, 42, 42, 0.08)';
            feedback.style.border = '1px solid var(--neon-red)';
        }

        feedback.style.display = 'block';
        nextBtn.style.display = 'inline-block';
        
        MathJax.typesetPromise();
    }

    function nextQuestion() {
        currentQ++;
        loadQuestion();
    }

    function showResults() {
        pBar.style.width = `100%`;

        document.getElementById('progContainer').style.display = 'none';
        document.getElementById('quiz-container').style.display = 'none';
        
        const results = document.getElementById('results-container');
        const comment = document.getElementById('performance-comment');
        results.style.display = 'block';
        
        document.getElementById('finalScore').innerText = score;

        // Custom Egyptian engineering encouraging comments based on performance
        if(score === 100) {
            comment.innerHTML = "🏆 <b>امتياز مع مرتبة الشرف الأولى!</b> أنت أسطورة في التفاضل والتكامل يا هندسة. مفيش سؤال قدر يقف قدامك، تفكير ميكانيكي منظم وسرعة بديهة خيالية. أنت فخر لكلية الهندسة وكل الدكاترة يتمنوا طالب زيك! 🎉";
        } else if(score >= 85) {
